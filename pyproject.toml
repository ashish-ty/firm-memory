[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "firm-memory"
version = "1.0.0"
description = "Firm-wide engineering memory: a thin, firm-owned contract over a replaceable memory provider"
readme = "README.md"
requires-python = ">=3.11"
# The core package deliberately has no runtime dependencies. A provider brings
# its own, so a consumer that swaps providers does not keep carrying the old
# one, and importing firm_memory stays cheap.
dependencies = []

[project.optional-dependencies]
# The default provider.
mem0 = ["mem0ai>=2.0.14"]
# Self-hosted store. pgvector is the backend build_memory_config() targets.
pgvector = ["psycopg[binary,pool]>=3.1"]
# Local cross-encoder reranking — keeps retrieval quality without leaving the network.
rerank = ["sentence-transformers>=2.2.0"]
# The agent-facing MCP server.
mcp = ["mcp>=1.2"]
# Fact extraction for the ingestion pipeline. LiteLLM fronts every provider
# through one key, so changing model does not change this package.
extract = ["litellm>=1.50"]
# Local embeddings over ONNX. Much lighter than sentence-transformers (no
# torch), and keeps memory content off the network.
fastembed = ["fastembed>=0.3"]
# Everything examples/review_comment.py needs, so the demo is one install
# rather than four extras a reader has to compose correctly.
demo = [
    "mem0ai>=2.0.14",
    "psycopg[binary,pool]>=3.1",
    "litellm>=1.50",
    "fastembed>=0.3",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.6",
    "mem0ai>=2.0.14",
    "psycopg[binary,pool]>=3.1",
]

[project.scripts]
firm-memory-mcp = "firm_memory.mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/firm_memory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
# Docs keep hand-wrapped examples; ruff would flatten them into long single lines.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Tests name the behaviour under test; shadowing a builtin in a keyword argument
# (type=, id=) mirrors the API's own vocabulary.
"tests/**" = ["A002", "A003"]

[tool.coverage.run]
source = ["firm_memory"]
