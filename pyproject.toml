[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "firm-memory"
version = "1.0.0"
description = "Firm-wide engineering memory: a thin, firm-owned contract over a replaceable memory provider"
readme = "README.md"
requires-python = ">=3.11"
# Everything needed to run the platform and examples/review_comment.py, so a
# bare `uv sync` produces a working environment. These were previously extras a
# reader had to compose correctly, which was a reliable source of failures that
# only surfaced deep inside a mem0 factory.
#
# mem0ai floor is 2.0.20: earlier versions' fastembed embedder returns numpy
# arrays, which psycopg cannot bind, so writes to pgvector fail at insert time.
dependencies = [
    "mem0ai>=2.0.20",              # the memory provider
    "psycopg[binary,pool]>=3.1",   # the pgvector store
    "litellm>=1.99",               # one gateway key for any LLM (OpenRouter, proxies)
    "fastembed>=0.8",              # local ONNX embeddings; no torch, no egress
    "fastapi>=0.110",              # the review API
    "uvicorn>=0.27",               # and the server that runs it
]

[project.optional-dependencies]
# Genuinely optional, and heavy or niche enough not to install by default.
#
# Cross-encoder reranking improves retrieval quality but pulls in torch via
# sentence-transformers. The platform runs without it and says so once.
rerank = ["sentence-transformers>=2.2.0"]
# Only needed to serve the agent-facing MCP server.
mcp = ["mcp>=1.2"]

[dependency-groups]
# Installed by `uv sync` automatically, so the tests run straight after a clone.
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.6",
    "httpx>=0.27",                 # fastapi's TestClient transport
]

[project.scripts]
firm-memory-mcp = "firm_memory.mcp.server:main"
firm-memory-review = "firm_memory.review.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/firm_memory"]

[tool.hatch.build.targets.wheel.force-include]
# The review UI is a single static page served by the API. It has to travel
# with the wheel, or an installed firm-memory-review serves a 404.
"src/firm_memory/review/static" = "firm_memory/review/static"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
# Docs keep hand-wrapped examples; ruff would flatten them into long single lines.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Tests name the behaviour under test; shadowing a builtin in a keyword argument
# (type=, id=) mirrors the API's own vocabulary.
"tests/**" = ["A002", "A003"]

[tool.coverage.run]
source = ["firm_memory"]
