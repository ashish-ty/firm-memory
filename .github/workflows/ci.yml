name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        # uv sync installs the runtime dependencies and the dev group, so the
        # contract tests actually run: they pin constraints found by reading
        # mem0's source, and skipping them is how a provider upgrade would
        # quietly empty the pool.
        run: |
          pipx install uv || pip install uv
          uv sync --extra mcp --python "${{ matrix.python-version }}"

      - name: Lint
        run: uv run ruff check src tests examples

      - name: Test
        run: uv run pytest --cov --cov-report=term --cov-fail-under=85
