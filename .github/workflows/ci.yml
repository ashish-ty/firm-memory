name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        # mem0 and pgvector are installed so the contract tests actually run:
        # they pin constraints found by reading mem0's source, and skipping
        # them is how a provider upgrade would quietly empty the pool.
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[mem0,pgvector,mcp,dev]'

      - name: Lint
        run: ruff check src tests

      - name: Test
        run: pytest --cov --cov-report=term --cov-fail-under=85
